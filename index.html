  #vol{-webkit-appearance:none;appearance:none;width:84px;height:8px;background:rgba(246,244,238,.25);cursor:pointer;
    background-image:linear-gradient(var(--accent),var(--accent));background-repeat:no-repeat;background-size:60% 100%}

  @media (max-aspect-ratio:3/4){

    .badge{margin-bottom:9px} .tabs{margin-bottom:2px}

    button{padding:7px 9px;font-size:8px} .controls{gap:8px} .controls .primary{min-width:84px;font-size:9px;padding:8px 11px}
    .auto{font-size:7px} .sessions{font-size:6px}
    .badge{margin-bottom:9px} .tabs{margin-bottom:2px}
    /* มือถือแนวนอน: กล่องคำพูดอยู่ทางซ้ายของ auto run หางแหลมชี้ไปทางขวา */
    .tip{bottom:auto;top:50%;left:auto !important;right:calc(100% + 12px);transform:translateY(-50%);max-width:min(380px,50vw);font-size:7px;line-height:1.7}

  }
</style>

<body>
<div class="stage" id="stage"><canvas id="scene" aria-hidden="true"></canvas></div>
<div class="fx"></div><div id="lvh"></div>
<main class="ui">
  <header class="badge" aria-label="Nu•Dee pomodoro, birthday edition">
    <div class="stamp">LIMITED<br>1 of 1</div>
    <h1>Nu•Dee<em>pomodoro</em></h1>

  </header>
  <p class="hint blink" id="hint">press start to begin</p>
  <nav class="tabs" aria-label="Mode">
    <button data-mode="focus" class="active">focus</button>
    <button data-mode="short">short break</button>
    <button data-mode="long">long break</button>
  </nav>
  <div class="dial">
    <svg id="ring" viewBox="0 0 120 120" aria-hidden="true"></svg>
    <div class="center">
      <div class="time" id="time" role="timer" aria-live="off">25:00</div>
      <div class="adj"><button id="minus" aria-label="One minute less">-</button><span>minutes</span><button id="plus" aria-label="One minute more">+</button></div>
    </div>
  </div>
  <div class="controls">
    <button id="start" class="primary">start</button>
    <button id="reset">reset</button>
    <button id="skip">skip</button>
  </div>
  <div class="row">
    <label class="auto">
      <input type="checkbox" id="auto" aria-describedby="autoTip">
      <span class="box" aria-hidden="true"><svg viewBox="0 0 7 7"><rect x="0" y="3" width="1" height="1"/><rect x="1" y="4" width="1" height="1"/><rect x="2" y="5" width="1" height="1"/><rect x="3" y="4" width="1" height="1"/><rect x="4" y="3" width="1" height="1"/><rect x="5" y="2" width="1" height="1"/><rect x="6" y="1" width="1" height="1"/><rect x="1" y="3" width="1" height="1"/><rect x="2" y="4" width="1" height="1"/></svg></span>
      auto run
      <span class="tip" id="autoTip" role="tooltip">When time is up, the next timer starts by itself: focus, break, focus... until all 4 raindrops are filled. After the long break it switches off and waits for you to press start.</span>
    </label>

  </div>
</main>
<button id="install" hidden>install app</button>
<div class="keys">space = start/pause &nbsp; r = reset &nbsp; m = mute</div>
<div class="sound" id="sound">
  <button id="mute" aria-label="Mute sound" title="Sound on/off (M)">
    <svg viewBox="0 0 11 11" aria-hidden="true">
      <rect x="1" y="4" width="2" height="3" fill="#f6f4ee"/><rect x="3" y="3" width="1" height="5" fill="#f6f4ee"/><rect x="4" y="2" width="1" height="7" fill="#f6f4ee"/><rect x="5" y="1" width="1" height="9" fill="#f6f4ee"/>
      <g class="waves"><rect x="7" y="4" width="1" height="3"/><rect x="8" y="2" width="1" height="1"/><rect x="9" y="3" width="1" height="5"/><rect x="8" y="8" width="1" height="1"/></g>
      <g class="x"><rect x="7" y="3" width="1" height="1"/><rect x="8" y="4" width="1" height="1"/><rect x="9" y="5" width="1" height="1"/><rect x="8" y="6" width="1" height="1"/><rect x="7" y="7" width="1" height="1"/><rect x="9" y="3" width="1" height="1"/><rect x="9" y="7" width="1" height="1"/></g>
    </svg>
  </button>
  <input type="range" id="vol" min="0" max="100" value="60" aria-label="Volume">
</div>

<script>
/* ======================================================================
   PART 1 — คาเฟ่จิ๋วของหนู วันฝนตก (วาดด้วยโค้ดทั้งหมด)
   focus: หนูนั่งริมหน้าต่าง อ่านหนังสือ / ถักผ้าพันคอสีฟ้า ข้างนอกฝนตก ไฟเมืองเบลอเป็นวงสีฟ้า
   พัก:  หนูบิดขี้เกียจ แล้วจิบโกโก้หรืองีบหลับ ฝนหยุด มีรุ้งขึ้น
   ====================================================================== */
const cvs=document.getElementById('scene'), ctx=cvs.getContext('2d');
let W,H,P,gY,portrait, win={}, sill=0, seat={};
let interior=null, glass=[], trails=[], counterC=null, armorP=null, hudEdge=[], katP=null;
let time=0, theme=0, themeTarget=0;

function rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
let R=rng(1);
const ri=(a,b)=>Math.floor(a+R()*(b-a+1)), rf=(a,b)=>a+R()*(b-a), pick=a=>a[Math.floor(R()*a.length)];
const rnd=(a,b)=>a+Math.random()*(b-a), rpick=a=>a[Math.floor(Math.random()*a.length)];
const hx=h=>[parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)];
const mix=(a,b,t)=>{const A=hx(a),B=hx(b);return '#'+A.map((v,i)=>Math.round(v+(B[i]-v)*t).toString(16).padStart(2,'0')).join('');};
function ell(g,cx,cy,rx,ry){ for(let y=-ry;y<=ry;y++){ const w=Math.round(rx*Math.sqrt(Math.max(0,1-(y*y)/(ry*ry)))); g.fillRect(Math.round(cx)-w,Math.round(cy)+y,w*2+1,1);} }
function disc(g,cx,cy,r){ ell(g,cx,cy,r,r); }
function line(g,x0,y0,x1,y1){ x0=Math.round(x0);y0=Math.round(y0);x1=Math.round(x1);y1=Math.round(y1);
  const dx=Math.abs(x1-x0),dy=-Math.abs(y1-y0),sx=x0<x1?1:-1,sy=y0<y1?1:-1;let e=dx+dy;
  for(;;){g.fillRect(x0,y0,1,1);if(x0===x1&&y0===y1)break;const e2=2*e;if(e2>=dy){e+=dy;x0+=sx;}if(e2<=dx){e+=dx;y0+=sy;}}}
const mk=(w,h)=>{const c=document.createElement('canvas');c.width=w;c.height=h;return c;};
const inWin=(x,y)=>x>=win.x0&&x<win.x1&&y>=win.y0&&y<win.y1&&!(y<win.y0+win.arch && Math.hypot(x-(win.x0+win.x1)/2,(y-win.y0-win.arch)*(win.x1-win.x0)/(2*win.arch))>(win.x1-win.x0)/2);

/* ---------- ขนาดจอ ---------- */
/* iPhone/iPad: Safari บางเวอร์ชัน (รวมแอปที่ติดตั้งลงหน้าจอโฮม) รายงานความสูงจอสั้นกว่าจริง ทำให้ขอบล่างลอย
   ถ้าเป็นอุปกรณ์ iOS และหน้าแอปกว้างเต็มจอ ให้ใช้ขนาดจอจริงไปเลย */
function fullScreenIOS(w,h){
  if(navigator.standalone) return true;
  const ios=/iPhone|iPad|iPod/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
  if(!ios) return false;
  const a=Math.min(screen.width,screen.height), b=Math.max(screen.width,screen.height);
  return Math.abs((w>h?b:a)-w)<=2;
}
function viewSize(){
  const r=document.querySelector('.fx').getBoundingClientRect();
  const lv=document.getElementById('lvh').getBoundingClientRect().height||0;
  let w=Math.max(r.width,innerWidth), h=Math.max(r.height,innerHeight,lv);
  if(fullScreenIOS(w,h)){ const a=Math.min(screen.width,screen.height), b=Math.max(screen.width,screen.height);
    if(w>h){ w=Math.max(w,b); h=Math.max(h,a);} else { w=Math.max(w,a); h=Math.max(h,b);} }
  return [Math.round(w),Math.round(h)];
}
let lastVW=0,lastVH=0,sizeCheck=0;
function resize(){
  const [vw,vh]=viewSize(); lastVW=vw; lastVH=vh;
  const st=document.getElementById('stage'); st.style.width=vw+'px'; st.style.height=vh+'px';
  portrait=vw/vh<.75;
  P=Math.max(3,Math.round(vh/(portrait?170:125)));
  W=Math.ceil(vw/P); H=Math.ceil(vh/P);
  cvs.width=W; cvs.height=H; cvs.style.width=W*P+'px'; cvs.style.height=H*P+'px';
  ctx.imageSmoothingEnabled=false;
  build();
}
function checkSize(){ const [w,h]=viewSize(); if(w!==lastVW||h!==lastVH) resize(); }

/* ---------- STEP 1: ผังห้อง ---------- */
function build(){
  R=rng(5);
  gY=Math.round(H*.9);
  if(portrait) win={x0:Math.round(W*.07), x1:W-Math.round(W*.07), y0:Math.round(H*.55), y1:Math.round(H*.8)};
  else          win={x0:Math.round(W*.06), x1:Math.round(W*.58), y0:Math.round(H*.1),  y1:Math.round(H*.66)};
  win.arch=Math.round((win.x1-win.x0)*.22);
  sill=win.y1+3;
  seat={x:Math.round(win.x0+(win.x1-win.x0)*(portrait?.3:.36)), y:sill};
  glass=[]; trails=[]; wxParts=[]; skyC=[]; skyT=[];
  buildStrips();
  for(let s=0;s<5;s++) renderSky(s);
  buildInterior();
  buildSouvenirs();
}

/* ---------- STEP 2: การเดินทางผ่านเมืองต่างๆ นอกหน้าต่าง ----------
   focus ครบแต่ละรอบ คาเฟ่จะลอยไปเมืองถัดไป: เมืองฝนตก → เมืองนีออน → เมืองซากุระ → หมู่บ้านหิมะ → งานวันเกิด (long break)
   แต่ละเมืองวาด 2 แบบ: กลางคืน (ตอน focus) กับกลางวันแดดออก (ตอนพัก) แล้วค่อยๆ ผสมกันตาม theme
   ตึกแต่ละชั้นวาดเป็นแถบยาว 2 เท่าของจอแล้วเลื่อนวน ชั้นไกลเลื่อนช้า ชั้นใกล้เลื่อนเร็ว (parallax)
   ไฟจากหน้าต่างตึก/ป้ายนีออน/โคมไฟ แยกไว้อีกแถบ ตอนกลางวันจะดับไป */
const CITIES=[
  {name:'rain city',     skyN:['#16233f','#1b2b4d','#21345a','#283e66','#2f4870'], skyD:['#4f9de0','#6fb3ea','#99cdf2','#c9e6f8','#fff0cc'], beam:'#ffc65a', wx:'rain'},
  {name:'neon city',     skyN:['#120a2a','#1f0f3d','#341457','#4f1a6e','#7a2a86'], skyD:['#6f7fe0','#9a8fe0','#d99bd0','#ffb8b0','#ffdcae'], beam:'#ff9fcf', wx:'drizzle'},
  {name:'sakura town',   skyN:['#2a2a5c','#433874','#6a4885','#9d5c8e','#d9858e'], skyD:['#6aa8e8','#8cc0ee','#b9d8f2','#f4d9c4','#ffe3ad'], beam:'#ffb45c', wx:'petals'},
  {name:'snow village',  skyN:['#0b1430','#10203f','#16294d','#1c345c','#2c4f7a'], skyD:['#7fb6ea','#9fcaf0','#c3def5','#e4f0fa','#fffaf0'], beam:'#fff1c8', wx:'snow'},
  {name:'birthday party',skyN:['#4f9de0','#7cbbe9','#b9d4f0','#f8d4c4','#ffd8a0'], skyD:['#4f9de0','#7cbbe9','#b9d4f0','#f8d4c4','#ffd8a0'], beam:'#ffd27a', wx:'confetti'},
];
let stage=0, prevStage=0, stageFade=1, travel=0, speed=.25, speedTarget=.25, strips=[], skyC=[], skyT=[], arriveT=-99, leaveT=-99, wxParts=[], balloons=[];

function renderSky(s){
  if(!skyC[s]) skyC[s]=mk(W,H);
  const g=skyC[s].getContext('2d'), C=CITIES[s], cols=C.skyN.map((c,i)=>mix(c,C.skyD[i],theme)), n=cols.length, top=win.y0-2, bh=(win.y1+4-top)/n;
  g.clearRect(0,0,W,H);
  for(let i=0;i<n;i++){ g.fillStyle=cols[i]; g.fillRect(win.x0-6,Math.floor(top+i*bh),win.x1-win.x0+12,Math.ceil(bh)+1); }
  for(let i=1;i<n;i++){ const y=Math.floor(top+i*bh); g.fillStyle=cols[i-1]; for(let x=win.x0-6;x<win.x1+6;x+=2) g.fillRect(x,y,1,1); }
  const sunA = s===4 ? 1 : theme;
  if(sunA>.05){ const sx=win.x0+(win.x1-win.x0)*.2, sy=win.y0+win.arch*.9, sr=Math.max(4,Math.round(H*.04));
    g.fillStyle=s===1?'#ffe0c8':'#fff6d0'; g.globalAlpha=.18*sunA; disc(g,sx,sy,sr+8); g.globalAlpha=.35*sunA; disc(g,sx,sy,sr+4); g.globalAlpha=sunA; disc(g,sx,sy,sr); g.globalAlpha=1; }
  if(s===1 && theme<.95){ g.fillStyle='#f6e6ff'; g.globalAlpha=1-theme; const mx=win.x1-(win.x1-win.x0)*.22, my=win.y0+win.arch*.9; disc(g,mx,my,3); g.fillStyle=cols[1]; disc(g,mx+2,my-1,3); g.globalAlpha=1; }
  if(s===0 && theme>.05){   // รุ้งหลังฝน (อยู่ฝั่งตรงข้ามดวงอาทิตย์)
    const cx=(win.x0+win.x1)/2+(win.x1-win.x0)*.15, cy=win.y1+(win.y1-win.y0)*.2, r0=(win.x1-win.x0)*.42, RB=['#ff9fb3','#ffc48a','#ffe58a','#a8e6b4','#8fd3ff','#a9a3ff'];
    g.globalAlpha=.55*theme; for(let i=0;i<RB.length;i++){ g.fillStyle=RB[i]; const r=r0-i*1.5; for(let a=Math.PI*1.05;a<Math.PI*1.95;a+=.6/r) g.fillRect(Math.round(cx+Math.cos(a)*r),Math.round(cy+Math.sin(a)*r),1,2); }
    g.globalAlpha=1; }
  if(theme<.6 && s!==4){ g.fillStyle='#ffffff'; R=rng(90+s); for(let i=0;i<(win.x1-win.x0)/5;i++){ g.globalAlpha=(1-theme)*rf(.2,.7); g.fillRect(ri(win.x0,win.x1),ri(win.y0,win.y0+(win.y1-win.y0)*.45),1,1); } g.globalAlpha=1; }
  skyT[s]=theme;
}

function buildStrips(){
  strips=[];
  const wh=win.y1-win.y0, base=win.y1+3, L=Math.max(W*2,320);
  for(let s=0;s<5;s++){
    R=rng(300+s*17);
    const farN=mk(L,H), farD=mk(L,H), midN=mk(L,H), midD=mk(L,H), lights=mk(L,H);
    const fN=farN.getContext('2d'), fD=farD.getContext('2d'), mN=midN.getContext('2d'), mD=midD.getContext('2d'), lt=lights.getContext('2d');
    const both=(fn,x,w)=>{ fn(x); if(x+w>L) fn(x-L); if(x<0) fn(x+L); };
    const glowPx=(x,y,c,r)=>both(xx=>{ lt.fillStyle=c; lt.globalAlpha=.22; lt.fillRect(xx-r,y-r,2*r+1,2*r+1); lt.globalAlpha=1; lt.fillRect(xx,y,1,1); },x,1);
    const rect=(gN,gD,cN,cD,x,y,w,h)=>both(xx=>{ gN.fillStyle=cN; gN.fillRect(xx,y,w,h); gD.fillStyle=cD; gD.fillRect(xx,y,w,h); },x,w);
    if(s===0){       // เมืองฝนตก: ตึกฟ้าๆ ไฟหน้าต่าง + ไฟเมืองเบลอเป็นวง
      for(let x=0;x<L;){ const w=ri(8,16), h=ri(Math.round(wh*.45),Math.round(wh*.75)); rect(fN,fD,'#1a2a4a','#a9c6e6',x,base-h,w,h); x+=w+ri(0,3); }
      for(let x=0;x<L;){ const w=ri(6,14), h=ri(Math.round(wh*.25),Math.round(wh*.6)), top=base-h;
        rect(mN,mD,'#1e2f52','#8fb3d9',x,top,w,h);
        for(let wy=top+2;wy<base;wy+=3) for(let wx=x+1;wx<x+w-1;wx+=2){ rect(mN,mD,'#2a3f68','#b9d3ec',wx,wy,1,1); if(R()<.35) glowPx(wx,wy,R()<.6?'#ffd98a':'#a8e0ff',0); }
        x+=w+ri(0,2); }
      for(let i=0;i<L*.35;i++){ const x=rf(0,L), y=rf(win.y0+wh*.35,base), r=ri(1,4), c=pick(['#7cc6f2','#4f9de0','#a8e0ff','#ffffff','#ffd98a','#ff9fc4','#9fb4ff']);
        both(xx=>{ lt.fillStyle=c; lt.globalAlpha=.16; disc(lt,xx,y,r+1); lt.globalAlpha=.22; disc(lt,xx,y,r); lt.globalAlpha=1; },x-r,2*r); }
    }
    if(s===1){       // เมืองนีออน cyberpunk
      for(let x=0;x<L;){ const w=ri(8,14), h=ri(Math.round(wh*.55),Math.round(wh*.92)); rect(fN,fD,'#2a1650','#b9a6d9',x,base-h,w,h);
        if(R()<.4){ rect(fN,fD,'#2a1650','#b9a6d9',x+Math.floor(w/2),base-h-ri(4,8),1,8); glowPx(x+Math.floor(w/2),base-h-8,'#ff4f6d',1); }
        for(let wy=base-h+3;wy<base;wy+=4) for(let wx=x+2;wx<x+w-1;wx+=3) if(R()<.25) glowPx(wx,wy,'#7a5cff',0);
        x+=w+ri(0,2); }
      for(let x=0;x<L;){ const w=ri(7,15), h=ri(Math.round(wh*.3),Math.round(wh*.7)), top=base-h;
        rect(mN,mD,'#140b26','#7d6fa8',x,top,w,h); rect(mN,mD,'#2a1a4a','#9a8cc4',x,top,w,1);
        for(let wy=top+2;wy<base;wy+=3) for(let wx=x+1;wx<x+w-1;wx+=2){ if(R()<.3) glowPx(wx,wy,R()<.5?'#3ff0ff':'#ff3fd8',0); else rect(mN,mD,'#241640','#a99bd0',wx,wy,1,1); }
        if(R()<.7){ const vert=R()<.6, c=pick(['#ff3fd8','#3ff0ff','#ffe14d','#b56cff']), sw=vert?2:Math.min(w-2,ri(5,9)), sh=vert?ri(6,12):3, sx=vert?(R()<.5?x-1:x+w-1):x+1, sy=top+ri(2,Math.max(2,Math.floor(h*.4)));
          rect(mN,mD,'#0b0620',mix(c,'#7d6fa8',.6),sx,sy,sw,sh);
          for(let yy=sy;yy<sy+sh;yy++) for(let xx=sx;xx<sx+sw;xx++) if(R()<.75) glowPx(xx,yy,c,1); }
        x+=w+ri(0,2); }
    }
    if(s===2){       // เมืองซากุระ: ภูเขา เจดีย์ บ้านไม้ โคมแดง ต้นซากุระ
      for(let x=0;x<L;x++){ const k=2*Math.PI*x/L, h=Math.round(wh*(.38+.08*Math.sin(k*3)+.05*Math.sin(k*7+1))); rect(fN,fD,'#3a2f5c','#a6b8d8',x,base-h,1,h); }
      const px=rf(0,L-20); let py=base-Math.round(wh*.4);
      for(let i=0;i<5;i++){ const w=11-2*i; rect(fN,fD,'#2c2448','#8a9cc4',px-Math.floor((w-4)/2),py-3,w-4,3); rect(fN,fD,'#2c2448','#8a9cc4',px-Math.floor(w/2),py-4,w,1); py-=4; }
      rect(fN,fD,'#2c2448','#8a9cc4',px,py-4,1,4);
      for(let x=0;x<L;){
        if(R()<.3){ const cx=x+6, cy=base-Math.round(wh*.32); for(let k=0;k<6;k++){ const bx=cx+ri(-5,5), by=cy+ri(-3,3), r=ri(2,4);
            both(xx=>{ mN.fillStyle='#a0628a'; disc(mN,xx,by,r); mD.fillStyle='#f4a6bf'; disc(mD,xx,by,r); },bx-r,2*r); }
          rect(mN,mD,'#3a2420','#7a5238',cx,cy+2,2,base-cy-2); x+=13; continue; }
        const w=ri(12,20), wallH=ri(6,10), top=base-wallH;
        rect(mN,mD,'#3a2420','#c9a27f',x,top,w,wallH);
        for(let r=0;r<4;r++) rect(mN,mD,'#2c283f','#5b5f7e',x-2+r,top-1-r,w+4-2*r,1);
        const dx=x+ri(2,Math.max(2,w-7)); glowPx(dx,top+2,'#ffcf7a',0); glowPx(dx+1,top+2,'#ffcf7a',0); glowPx(dx,top+3,'#ffcf7a',0); glowPx(dx+1,top+3,'#ffcf7a',0);
        if(R()<.7){ const lx=x+ri(1,w-3); rect(mN,mD,'#d64030','#e86a5a',lx,top+1,2,3); glowPx(lx,top+2,'#ff7a4a',2); }
        x+=w+ri(2,5); }
    }
    if(s===3){       // หมู่บ้านหิมะ: ภูเขาหิมะ ต้นสน กระท่อมไฟอุ่น
      for(let i=0;i<7;i++){ const px=rf(0,L), h=ri(Math.round(wh*.3),Math.round(wh*.55)), w=h*1.3;
        for(let y=0;y<=h;y++){ const half=Math.round(w*y/h); rect(fN,fD,y<h*.3?'#dde8f5':'#2b4466',y<h*.3?'#ffffff':'#9fbbe0',Math.round(px-half),base-h+y-4,half*2+1,1); } }
      for(let x=0;x<L;){
        if(R()<.45){ const h=ri(8,14); for(let y=0;y<h;y++){ const w=Math.floor(y*.45); rect(mN,mD,y%4===1?'#c9d8ea':'#16283c',y%4===1?'#ffffff':'#3f6a5a',x-w,base-h+y,w*2+1,1); } x+=ri(4,7); continue; }
        const w=ri(10,16), wallH=ri(6,9), top=base-wallH;
        rect(mN,mD,'#4a3326','#8a5f40',x,top,w,wallH);
        for(let r=0;r<4;r++) rect(mN,mD,'#dde8f5','#ffffff',x-2+r,top-1-r,w+4-2*r,1);
        rect(mN,mD,'#3a3a46','#8a8a96',x+w-4,top-6,2,3);
        const wx=x+ri(2,Math.max(2,w-5)); for(let yy=0;yy<2;yy++) for(let xx=0;xx<2;xx++) glowPx(wx+xx,top+2+yy,'#ffc46b',xx+yy===0?2:0);
        x+=w+ri(3,6); }
    }
    if(s===4){       // เหนือเมฆ: ทะเลเมฆสีชมพูทอง
      for(let x=0;x<L;x+=6){ const y=base-Math.round(wh*.22)+Math.round(3*Math.sin(x*.3)); both(xx=>{ fN.fillStyle='#f6dfe6'; disc(fN,xx,y,5); fD.fillStyle='#f6dfe6'; disc(fD,xx,y,5); },x-5,10); }
      rect(fN,fD,'#f6dfe6','#f6dfe6',0,base-Math.round(wh*.22)+3,L,H);
      for(let x=0;x<L;x+=7){ const y=base-Math.round(wh*.12)+Math.round(2*Math.sin(x*.25)); both(xx=>{ mN.fillStyle='#ffffff'; disc(mN,xx,y,5); mD.fillStyle='#ffffff'; disc(mD,xx,y,5); },x-5,10); }
      rect(mN,mD,'#ffffff','#ffffff',0,base-Math.round(wh*.12)+3,L,H);
    }
    strips.push({L,farN,farD,midN,midD,lights});
  }
}
/* แสงเหนือ (ยกมาจาก Snow Nook): วาดทีละคอลัมน์ ตำแหน่งแถบขึ้นลงตามคลื่น sin หลายลูก
   สีไล่จากเขียวไปม่วง บวกแสงแบบ 'lighter' วาดเฉพาะช่วงหน้าต่าง ครึ่งบนของกระจก */
function drawAurora(a){
  if(a<.02) return;
  const t=time, wh=win.y1-win.y0, top=win.y0;
  ctx.globalCompositeOperation='lighter';
  for(let band=0;band<2;band++){
    for(let x=win.x0;x<win.x1;x++){
      const yc=top+wh*(.42+band*.1)+Math.sin(x*.06+t*.25+band*2)*wh*.07+Math.sin(x*.13-t*.18)*wh*.035;
      const hgt=wh*(.2+band*.05)*(.6+.4*Math.sin(x*.09+t*.4+band));
      const shimmer=.55+.45*Math.sin(x*.35+t*1.6+band*3);
      for(let k=0;k<5;k++){
        const yy=Math.round(yc-hgt*(k+1)/5), h=Math.ceil(hgt/5);
        ctx.globalAlpha=a*.3*(1-k/5)*shimmer*(band?.75:1);
        ctx.fillStyle = k<2 ? '#5cf2b0' : k<4 ? '#4fd6c9' : '#9a7cf2';
        ctx.fillRect(x,yy,1,h);
      }
    }
  }
  ctx.globalAlpha=1; ctx.globalCompositeOperation='source-over';
}
function drawCity(s,alpha){
  if(alpha<=0) return;
  ctx.globalAlpha=alpha; ctx.drawImage(skyC[s],0,0);
  if(s===3) drawAurora(alpha*(1-theme));   // หมู่บ้านหิมะตอนกลางคืนมีแสงเหนือ
  const st=strips[s];
  for(const [n,d,f] of [[st.farN,st.farD,.15],[st.midN,st.midD,.45]]){
    const off=Math.round(-((travel*f)%st.L));
    ctx.globalAlpha=alpha; ctx.drawImage(n,off,0); ctx.drawImage(n,off+st.L,0);
    if(theme>0){ ctx.globalAlpha=alpha*theme; ctx.drawImage(d,off,0); ctx.drawImage(d,off+st.L,0); }
  }
  if(theme<1){ const off=Math.round(-((travel*.45)%st.L)); ctx.globalCompositeOperation='lighter'; ctx.globalAlpha=alpha*(1-theme)*(s===1?.85+.15*Math.sin(time*7)*Math.sin(time*3):.9);
    ctx.drawImage(st.lights,off,0); ctx.drawImage(st.lights,off+st.L,0); ctx.globalCompositeOperation='source-over'; }
  ctx.globalAlpha=1;
}
function setStage(s){ if(s===stage) return; prevStage=stage; stage=s; stageFade=0; wxParts=[]; if(s===4) arriveT=time; if(prevStage===4) leaveT=time; }
/* เกาะงานวันเกิด: ตอนเริ่ม long break เกาะค่อยๆ ลอยเข้ามาจากขอบขวาพร้อมลอยขึ้นจากด้านล่าง แล้วชะลอจอดตรงหน้าต่าง (8 วินาที)
   จบ long break เกาะค่อยๆ ไหลออกไปทางซ้าย คำนวณจากเวลา จึงไม่กระโดดเวลาหมุนจอ */
function drawPartyIsland(){
  const w=Math.min(34,Math.round((win.x1-win.x0)*.3)), target=win.x0+(win.x1-win.x0)*.76, bob=Math.sin(time*.8)*1.2;
  let x, dy=0;
  if(stage===4){ const p=Math.min(1,(time-arriveT)/8), e=p*p*(3-2*p), start=win.x1+w+14; x=start+(target-start)*e; dy=(1-e)*10; }
  else if(time-leaveT<6){ const p=(time-leaveT)/6, e=p*p, end=win.x0-w-14; x=target+(end-target)*e; dy=-e*4; }
  else return;
  ctx.globalAlpha=1; drawIsland(x, Math.round(dy+bob));
}

/* เกาะงานวันเกิด (ปลายทาง) */
function drawIsland(ix,dy=0){
  const w=Math.min(34,Math.round((win.x1-win.x0)*.3)), top=win.y1-Math.round((win.y1-win.y0)*.3)+dy;
  for(let y=0;y<12;y++){ const hw=Math.round(w*(1-y/12)); ctx.fillStyle=y<2?'#7cc67f':'#8a6a52'; ctx.fillRect(Math.round(ix-hw),top+y,hw*2+1,1); }
  ctx.fillStyle='#5aa469'; ctx.fillRect(Math.round(ix-w),top,w*2+1,2);
  const tx=Math.round(ix-6); for(let r=0;r<8;r++){ const hw=r; for(let x=-hw;x<=hw;x++){ ctx.fillStyle=(Math.floor((x+20)/2)&1)?'#ffffff':'#7cc6f2'; ctx.fillRect(tx+x,top-8+r,1,1);} }
  ctx.fillStyle='#ff9fc4'; ctx.fillRect(tx,top-11,1,3); ctx.fillRect(tx+1,top-11,2,1);
  const kx=Math.round(ix+9); ctx.fillStyle='#ffe9b8'; ctx.fillRect(kx-4,top-5,9,4); ctx.fillStyle='#7cc6f2'; ctx.fillRect(kx-4,top-6,9,1); ctx.fillRect(kx-2,top-8,5,2);
  ctx.fillStyle='#ffffff'; ctx.fillRect(kx,top-11,1,3); ctx.fillStyle=Math.sin(time*12)>0?'#ffd166':'#ff9f43'; ctx.fillRect(kx,top-12,1,1);
  const cols=['#7cc6f2','#ff9fc4','#ffd166','#a8e6b4'];
  for(let i=0;i<4;i++){ const bx=Math.round(ix-w+5+i*(w*2-10)/3), by=top-20+Math.round(Math.sin(time*1.5+i)*2)-(i%2)*3; ctx.fillStyle='#ffffff'; ctx.fillRect(bx,by+3,1,top-by-3); ctx.fillStyle=cols[i]; ell(ctx,bx,by,2,3); }
}

/* อากาศของแต่ละเมือง: ฝน / ฝนปรอยนีออน / กลีบซากุระ / หิมะ / พลุกระดาษกับลูกโป่ง */
function weatherLevel(){ const wx=CITIES[stage].wx; return wx==='rain' ? 1-theme : wx==='drizzle' ? (1-theme)*.45 : 0; }
function drawWeather(dt){
  const wx=CITIES[stage].wx, ww=win.x1-win.x0, wh=win.y1-win.y0;
  const want = wx==='rain'||wx==='drizzle' ? Math.round(ww*wh/30) : wx==='petals' ? Math.round(ww*wh/220) : wx==='snow' ? Math.round(ww*wh/(theme>.5?600:90)) : Math.round(ww*wh/160);
  while(wxParts.length<want) wxParts.push({x:rnd(win.x0-10,win.x1+10), y:rnd(win.y0-20,win.y1), v:rnd(.8,1.2), p:Math.random()*6, c:rpick(['#7cc6f2','#ff9fc4','#ffd166','#a8e6b4','#c3a6ff','#ffffff'])});
  if(wxParts.length>want) wxParts.length=want;
  const drift = speed*14;
  for(const q of wxParts){
    if(wx==='rain'||wx==='drizzle'){ q.y+=95*q.v*dt; q.x-=(16+drift)*dt; const a=weatherLevel()/(wx==='drizzle'?.45:1); if(a<.02) continue;
      ctx.fillStyle=wx==='drizzle'?(q.p<3?'#d6a8ff':'#a8f0ff'):'#a8c8e8'; ctx.globalAlpha=.45*a; for(let k=0;k<3;k++) ctx.fillRect(Math.round(q.x+k*.18),Math.round(q.y-k),1,1); }
    else if(wx==='petals'){ q.y+=10*q.v*dt; q.x-=(8+drift*1.3)*dt; ctx.fillStyle=q.p<2?'#fff0f4':'#ffb7c9'; ctx.globalAlpha=.9; const f=Math.sin(time*3+q.p)>0; ctx.fillRect(Math.round(q.x+Math.sin(time+q.p)*2),Math.round(q.y),f?2:1,1); }
    else if(wx==='snow'){ q.y+=12*q.v*dt; q.x-=(2+drift)*dt; ctx.fillStyle='#ffffff'; ctx.globalAlpha=.9; ctx.fillRect(Math.round(q.x+Math.sin(time*q.v+q.p)*2),Math.round(q.y),1,1); }
    else { q.y+=14*q.v*dt; q.x+=Math.sin(time*2+q.p)*6*dt; ctx.fillStyle=q.c; ctx.globalAlpha=.95; const f=Math.sin(time*8+q.p)>0; ctx.fillRect(Math.round(q.x),Math.round(q.y),f?2:1,f?1:2); }
    if(q.y>win.y1+2||q.x<win.x0-12){ q.y=win.y0-rnd(2,20); q.x=rnd(win.x0,win.x1+12); }
  }
  ctx.globalAlpha=1;

  g.fillStyle='#ffffff'; g.fillRect(0,tileTop-1,W,1);

  for(let y=gY,row=0;y<H;y+=3,row++){ g.fillStyle=row%2?'#6e4a36':'#7a523c'; g.fillRect(0,y,W,3); g.fillStyle='#5a3a2a'; for(let x=(row*7)%15;x<W;x+=15) g.fillRect(x,y,1,3); }
  g.fillStyle='#4a3022'; g.fillRect(0,gY,W,1);
  // หน้าต่างโค้ง: กรอบไม้ แล้วเว้นช่องใส
  const {x0,x1,y0,y1,arch}=win, cxw=(x0+x1)/2;

  for(let y=y0-4;y<y1+3;y++) for(let x=x0-4;x<x1+4;x++){ if(y<y0+arch){ const ry=(y-(y0+arch))*(x1-x0+8)/(2*(arch+4)); if(Math.hypot(x-cxw,ry)>(x1-x0+8)/2) continue; } g.fillRect(x,y,1,1); }
  for(let y=y0;y<y1;y++) for(let x=x0;x<x1;x++) if(inWin(x,y)) g.clearRect(x,y,1,1);
  g.fillStyle='#8a5a3e'; const mx=Math.round(cxw); g.fillRect(mx-1,y0,2,y1-y0);                 // เสากลาง
  const ty=Math.round(y0+arch+(y1-y0-arch)*.35); for(let x=x0;x<x1;x++) if(inWin(x,ty)) g.fillRect(x,ty,1,1);
  g.fillStyle='#a8744e'; for(let x=x0-4;x<x1+4;x++){ }
  // ขอบหน้าต่างกว้าง (ที่นั่งของหนู) + เบาะ
  g.fillStyle='#c99a6a'; g.fillRect(x0-7,sill-1,x1-x0+14,3); g.fillStyle='#a8744e'; g.fillRect(x0-7,sill+2,x1-x0+14,2); g.fillStyle='#e0b88a'; g.fillRect(x0-7,sill-1,x1-x0+14,1);
  const cw=26; g.fillStyle='#4f9de0'; g.fillRect(seat.x-4,sill-3,cw,3); g.fillRect(seat.x-3,sill-4,cw-2,1);
  g.fillStyle='#7cc6f2'; for(let x=seat.x-3;x<seat.x+cw-5;x+=3) g.fillRect(x,sill-3,1,1);
  // ต้นไม้ในกระถาง + หนังสือซ้อนบนขอบหน้าต่าง
  const px=x1-9;

  g.fillStyle='#4f9e6b'; ell(g,px+3,sill-10,4,4); g.fillStyle='#6fbf85'; ell(g,px+2,sill-12,2,2); g.fillRect(px+5,sill-9,2,1);
  const bx=x0+2;

  // ฝั่งขวา: เคาน์เตอร์ ชั้นวางของ เมนูกระดาน

    armorP={x:rx+13,y:ct+3}; katP={x:rx-9,y:gY+1};

  hudEdge=[]; { const cx=(x0+x1)/2, cy=(y0+y1)/2;
    for(let y=y0;y<y1;y++) for(let x=x0;x<x1;x++) if(inWin(x,y) && (!inWin(x-1,y)||!inWin(x+1,y)||!inWin(x,y-1)||!inWin(x,y+1))) hudEdge.push([x,y,Math.atan2(y-cy,x-cx)]);
    hudEdge.sort((a,b)=>a[2]-b[2]); }
  // กระดานดำเล็กเหนือหน้าต่าง: รูปเค้กวันเกิดวาดด้วยชอล์ก
  const kx=Math.round(cxw)-9, ky=Math.max(2,y0-17);
  if(!portrait && ky>2){

    g.fillStyle='#f6f4ee'; g.fillRect(kx+5,ky+5,8,3); g.fillRect(kx+6,ky+4,6,1); g.fillStyle='#ff9fc4'; g.fillRect(kx+5,ky+6,8,1);
    g.fillStyle='#ffd98a'; g.fillRect(kx+9,ky+2,1,2); g.fillStyle='#7cc6f2'; g.fillRect(kx+2,ky+2,1,1); g.fillRect(kx+15,ky+3,1,1); g.fillRect(kx+3,ky+7,1,1); g.fillRect(kx+14,ky+7,1,1);

}

const sprites={};
function mouseSprite(eyes,earUp){
  const key=eyes+(earUp?'^':''); if(sprites[key]) return sprites[key];
  const c=mk(22,21), g=c.getContext('2d');
  MOUSE.forEach((row,y)=>[...row].forEach((ch,x)=>{ if(ch==='.') return; const dy=(earUp && x>=10 && y<=6)?0:1; g.fillStyle=MPAL[ch]; g.fillRect(x,y+dy,1,1); }));
  for(const [x,y,c] of EYES[eyes]){ g.fillStyle=MPAL[c]; g.fillRect(x,y+1,1,1); }
  return sprites[key]=c;
}

let mouse={blink:2, ear:0, page:-1, sip:0, act:'idle', breakAct:'sip', t:0};
function drawTail(x,y){ ctx.fillStyle='#f09ab8'; for(let i=0;i<15;i++){ const k=i/15; ctx.fillRect(Math.round(x-i*.9), Math.round(y-Math.sin(k*3+time*1.6)*2*k + k*k*2),1,1); } }
function focusProgress(){ return mode==='focus' ? 1-remaining/total : 0; }
function updateMouse(dt){
  let a = mode==='focus' ? (running ? (done%2?'knit':'read') : 'idle') : (running ? (mouse.t<4 ? 'stretch' : mouse.breakAct) : 'idle');
  if(mode!=='focus' && running && mouse.t>70){ mouse.breakAct = mouse.breakAct==='sip'?'nap':'sip'; mouse.t=4; }
  if(a!==mouse.act){ mouse.act=a; if(a==='stretch') Sound.yawn(); }
  if(mode!=='focus' && running) mouse.t+=dt; else mouse.t=0;
  mouse.blink-=dt; if(mouse.blink<-.13) mouse.blink=rnd(2.5,5.5);
  mouse.ear-=dt; if(mouse.ear<-.25 && Math.random()<dt/4) mouse.ear=.22;
  if(a==='read'){ if(mouse.page<0 && Math.random()<dt/14){ mouse.page=0; Sound.pageTurn(); } if(mouse.page>=0){ mouse.page+=dt; if(mouse.page>.7) mouse.page=-1; } }
  if((a==='read'||a==='knit'||a==='idle') && mouse.sip<=0 && Math.random()<dt/40) mouse.sip=3;
  if(mouse.sip>0) mouse.sip-=dt;
}
function drawMouse(){
  const a=mouse.act, x=seat.x, sitY=seat.y-3, y=sitY-21, blink=mouse.blink<0, ear=mouse.ear>0;
  const sipping = mouse.sip>0 && a!=='nap' && a!=='stretch';
  let eyes = blink?'shut':'open';
  if(a==='read' && !sipping) eyes = blink?'shut':'down';
  if(a==='knit' && !sipping) eyes = blink?'shut':'down';
  if(a==='nap') eyes='shut';
  if(a==='stretch') eyes='happy';
  const bob = a==='nap' ? (Math.sin(time*1.5)>0?1:0) : 0;
  drawTail(x+4,sitY-2);
  // แขนชูขึ้นตอนบิดขี้เกียจ
  if(a==='stretch'){ const up=Math.min(1,mouse.t/1.2)*(mouse.t<3.2?1:Math.max(0,(4-mouse.t)/.8)); const ay=Math.round(y+10-up*9);
    ctx.fillStyle=MPAL.F; ctx.fillRect(x+5,ay,2,y+12-ay); ctx.fillRect(x+16,ay,2,y+12-ay); ctx.fillStyle=MPAL.P; ctx.fillRect(x+5,ay-1,2,2); ctx.fillRect(x+16,ay-1,2,2); }
  ctx.drawImage(mouseSprite(eyes,ear),x,y+bob);
  if(a==='stretch'){ ctx.fillStyle=MPAL.O; ctx.fillRect(x+16,y+13,2,2); }                 // หาว
  if(mode==='long'){ const hb=y+bob; for(let r=0;r<5;r++){ ctx.fillStyle=r%2?'#7cc6f2':'#ff9fc4'; ctx.fillRect(x+10-Math.floor(r/2),hb+3+r,1+2*Math.floor(r/2),1); } ctx.fillStyle='#ffd166'; ctx.fillRect(x+10,hb+2,1,1); }
  // ของในมือ
  if(sipping){ mug(x+12,y+13+(mouse.sip<2.4?-3:0)); ctx.fillStyle=MPAL.P; ctx.fillRect(x+11,y+14,1,2); }
  else if(a==='read'){
    ctx.fillStyle='#4f9de0'; ctx.fillRect(x+8,y+17,9,1);
    ctx.fillStyle='#fffaf0'; ctx.fillRect(x+8,y+13,4,4); ctx.fillRect(x+13,y+13,4,4); ctx.fillStyle='#d9cdb2'; ctx.fillRect(x+12,y+13,1,4);
    ctx.fillStyle='#b9b0a0'; ctx.fillRect(x+9,y+14,2,1); ctx.fillRect(x+9,y+15,1,1); ctx.fillRect(x+14,y+14,2,1); ctx.fillRect(x+14,y+15,2,1);
    ctx.fillStyle=MPAL.P; ctx.fillRect(x+7,y+15,1,2); ctx.fillRect(x+17,y+15,1,2);
    if(mouse.page>=0){ const p=mouse.page/.7, px=x+16-Math.round(p*8), lift=Math.round(Math.sin(p*Math.PI)*2); ctx.fillStyle='#ffffff'; ctx.fillRect(Math.min(px,x+12),y+13-lift,Math.abs(px-(x+12))+1,1); }
  } else if(a==='knit'){
    // ถักผ้าพันคอสีฟ้า ยาวขึ้นตามเวลาที่ focus
    const len=1+Math.floor(focusProgress()*8), sw=Math.sin(time*6);
    for(let i=0;i<len;i++){ ctx.fillStyle=i%2?'#7cc6f2':'#4f9de0'; ctx.fillRect(x+10,y+15+i,5,1); }
    ctx.fillStyle='#f6f4ee'; ctx.fillRect(x+10,y+15+len,1,1); ctx.fillRect(x+12,y+15+len,1,1); ctx.fillRect(x+14,y+15+len,1,1);
    ctx.fillStyle='#c99a6a'; line(ctx,x+8,y+11+Math.round(sw),x+13,y+16); line(ctx,x+17,y+11-Math.round(sw),x+12,y+16);
    ctx.fillStyle=MPAL.P; ctx.fillRect(x+8,y+13,2,2); ctx.fillRect(x+15,y+13,2,2);
    ctx.fillStyle='#4f9de0'; disc(ctx,x+22,sitY-2,2); ctx.fillStyle='#7cc6f2'; ctx.fillRect(x+21,sitY-3,1,1);
    ctx.fillStyle='#4f9de0'; line(ctx,x+20,sitY-2,x+14,y+16);
  } else if(a==='idle'){
    mug(x+24,sitY-4,true);
  }
  if(a==='nap'){ for(let k=0;k<3;k++){ const ph=(time*.5+k/3)%1, zx=x+16+Math.round(ph*6)+k, zy=y+2-Math.round(ph*12); ctx.globalAlpha=1-ph; ctx.fillStyle='#ffffff'; const s=k===2?3:2;
      ctx.fillRect(zx,zy,s,1); ctx.fillRect(zx+s-1,zy+1,1,1); if(s===3) ctx.fillRect(zx+1,zy+1,1,1); ctx.fillRect(zx,zy+s-1,s,1); } ctx.globalAlpha=1; mug(x+24,sitY-4,true); }
  if(a==='read'||a==='knit') if(!sipping) mug(x+24,sitY-4,true);
}
function mug(x,y,onSill){
  ctx.fillStyle='#4f9de0'; ctx.fillRect(x,y,4,4); ctx.fillRect(x+4,y+1,1,2); ctx.fillStyle='#fff3e6'; ctx.fillRect(x,y,4,1); ctx.fillStyle='#a8e0ff'; ctx.fillRect(x+1,y+2,1,1);
  for(let k=0;k<3;k++){ const ph=(time*.7+k/3)%1; ctx.globalAlpha=.55*(1-ph); ctx.fillStyle='#ffffff'; ctx.fillRect(x+1+Math.round(Math.sin(ph*6+k)),y-1-Math.round(ph*6),1,1); }

}

/* ---------- STEP 5: ฝน ----------
   1) เส้นฝนตกเฉียงข้างนอก  2) หยดน้ำเกาะกระจก ไหลลงแบบหยุด-ไหล-หยุด ทิ้งรอยทางจางๆ  3) ฝนค่อยๆ หยุดตอนพัก */
function updateGlass(dt){
  if(Math.random()<dt*14*weatherLevel()) glass.push({x:rnd(win.x0,win.x1),y:rnd(win.y0,win.y1-4),r:Math.random()<.25?2:1,v:0,stick:rnd(.3,2)});
  for(const d of glass){
    d.stick-=dt;
    if(d.stick<0){ d.v=Math.min(26,d.v+60*dt); d.y+=d.v*dt; if(Math.random()<dt*2){ d.stick=rnd(.2,1); d.v=0; } if(Math.random()<dt*25) trails.push({x:Math.round(d.x),y:Math.round(d.y)-1,t:0}); }
  }
  glass=glass.filter(d=>d.y<win.y1 && inWin(Math.round(d.x),Math.round(d.y)));
  if(glass.length>140) glass.splice(0,glass.length-140);
  for(const t of trails) t.t+=dt; trails=trails.filter(t=>t.t<2.5);
}
/* ---------- STEP 6: ลูปแอนิเมชัน ---------- */
let last=performance.now();
function frame(now){
  const dt=Math.min(.05,(now-last)/1000); last=now; time+=dt;
  sizeCheck+=dt; if(sizeCheck>.3){ sizeCheck=0; checkSize(); }
  theme+=(themeTarget-theme)*Math.min(1,dt*.5); if(Math.abs(themeTarget-theme)<.002) theme=themeTarget;
  for(const s of [stage,prevStage]) if(Math.abs(theme-skyT[s])>.02 || (theme===themeTarget && skyT[s]!==theme)) renderSky(s);
  speed+=(speedTarget-speed)*Math.min(1,dt*.6); travel+=18*speed*dt;
  if(stageFade<1) stageFade=Math.min(1,stageFade+dt/2.5);
  updateMouse(dt); updateGlass(dt); updateSouvenirs();

  ctx.fillStyle='#1b2b4d'; ctx.fillRect(0,0,W,H);
  if(stageFade<1) drawCity(prevStage,1);
  drawCity(stage,stageFade);
  drawPartyIsland();
  drawWeather(dt);
  // หยดน้ำบนกระจก
  ctx.fillStyle='#d8ecfa';
  for(const t of trails){ ctx.globalAlpha=.18*(1-t.t/2.5); ctx.fillRect(t.x,t.y,1,1); }
  for(const d of glass){ ctx.globalAlpha=.75; ctx.fillStyle='#d8ecfa'; ctx.fillRect(Math.round(d.x),Math.round(d.y),d.r,d.r+1); ctx.fillStyle='#ffffff'; ctx.fillRect(Math.round(d.x),Math.round(d.y),1,1); }
  ctx.globalAlpha=1;
  // ฝ้าไอน้ำที่มุมกระจก
  ctx.fillStyle='#e8f2fa'; ctx.globalAlpha=.06+.08*weatherLevel(); ctx.fillRect(win.x0,win.y1-6,win.x1-win.x0,6); ctx.globalAlpha=1;

  drawHUD(false);
  ctx.drawImage(interior,0,0);
  drawHUD(true);
  drawArmor();
  if(counterC) ctx.drawImage(counterC,0,0);
  drawKatana();
  drawSouvenirs(false);
  drawMouse();
  drawSouvenirs(true);

/* ---------- STEP 8: ของที่ระลึกจากแต่ละเมือง ----------

    const N=hudEdge.length, shown=Math.floor(N*Math.min(1,k*1.5)), head=Math.floor(time*N/6)%N;
    ctx.fillStyle='#3ff0ff';
    for(let i=0;i<shown;i++){ const d=(head-i+N)%N, a=d<10 ? (.9-d*.07)*(.5+.5*n) : .22*n; if(a<=0) continue; ctx.globalAlpha=flick*a; ctx.fillRect(hudEdge[i][0],hudEdge[i][1],1,1); }
  }
  if(k<.35){ ctx.globalAlpha=1; return; }
  const k2=Math.min(1,(k-.35)/.65);
  if(!holo){
    // 2) มุมกรอบแบบเล็งเป้า (เล็กๆ ชิดขอบ)
    ctx.globalAlpha=flick*A*.7*k2; ctx.fillStyle='#bff8ff';
    for(const [bx,by,sx,sy] of [[x0+2,ry+1,1,1],[x1-3,ry+1,-1,1],[x0+2,y1-4,1,-1],[x1-3,y1-4,-1,-1]]){ ctx.fillRect(Math.min(bx,bx+sx*2),by,3,1); ctx.fillRect(bx,Math.min(by,by+sy*2),1,3); }
  }
  if(holo){
    // 3) ดวงตา AI เล็กๆ ใต้ยอดโค้ง: จุดหมุนรอบ + แกนกลางเต้น + กระพริบตาเป็นระยะ
    const oy=y0+Math.round(arch*.45), r=Math.max(2,Math.round(arch*.13)), spin=running?3:1.2;
    for(let i=0;i<8;i++){ const a=i/8*Math.PI*2, lit=((time*spin*1.4-i)%8+8)%8; ctx.globalAlpha=flick*A*k2*(lit<2?1-lit*.3:.45); ctx.fillStyle=lit<1?'#ffffff':'#3ff0ff'; ctx.fillRect(Math.round(cx+Math.cos(a)*r),Math.round(oy+Math.sin(a)*r),1,1); }
    const blink=(time%5)<.15, pulse=.75+.25*Math.sin(time*3);
    ctx.globalAlpha=flick*k2*pulse*(.45+.5*n); ctx.fillStyle=stage===4?'#ffd98a':'#ff6fd8';
    if(blink) ctx.fillRect(cx-1,oy,3,1); else ctx.fillRect(cx-1,oy-1,3,2);
    if(n>.05){ ctx.globalCompositeOperation='lighter'; ctx.globalAlpha=k2*.22*pulse*n; ctx.drawImage(glowSprite(r+2,'#3ff0ff'),cx-r-2,oy-r-2); ctx.globalCompositeOperation='source-over'; }
    ctx.globalAlpha=1; return;
  }
  // จากนี้ไปเป็นของที่โชว์แค่ตอนกลางคืน
  if(n>.05){
    const B=flick*k2*n;
    // 4) แผงเล็กมุมขวา: ไอคอนอากาศของเมือง + แถบเสียงขยับตามเพลง (ปิดเสียงจะนิ่ง)
    const px=x1-16, py=ry+3, muted=document.querySelector('.sound').classList.contains('muted');
    ctx.globalAlpha=B*.22; ctx.fillStyle='#0d1a3a'; ctx.fillRect(px,py,13,7);
    ctx.globalAlpha=B*.65; hudIcon(px+1,py+1);
    for(let i=0;i<3;i++){ const h=muted?1:1+Math.round((Math.sin(time*(4+i)+i*1.7)+1)*1.4); ctx.fillStyle=i===1?'#ff9fe6':'#7cc6f2'; ctx.fillRect(px+7+i*2,py+6-h,1,h); }
    // 5) เส้นสแกนบางๆ กวาดลงทุก 9 วินาที
    const sc=(time%9)/1.8; if(sc<1){ const sy=Math.round(y0+(y1-y0)*sc); ctx.globalAlpha=B*.1; ctx.fillStyle='#bff8ff'; for(let x=x0;x<x1;x++) if(inWin(x,sy)) ctx.fillRect(x,sy,1,1); }
  }
  // 6) แถบความคืบหน้า session บางๆ ชิดขอบล่างกระจก
  const left=running?Math.max(0,(endAt-performance.now())/1000):remaining, f=total>0?1-left/total:0, bw=x1-x0-12, by2=y1-2;
  ctx.globalAlpha=flick*A*.8*k2; ctx.fillStyle=mode==='focus'?'#3ff0ff':'#ffd98a'; ctx.fillRect(x0+6,by2,Math.round(bw*f*k2),1);
  if(running){ ctx.fillStyle='#ffffff'; ctx.fillRect(x0+6+Math.round(bw*f*k2),by2,1,1); }
  ctx.globalAlpha=1;
}

/* ---------- ดาบต้องสาป (ของที่ระลึกจากเมืองซากุระ) ----------
   คาตานะในฝักสีดำ วางพิงเคาน์เตอร์เอียงนิดๆ วาดทีละแถวจากล่างขึ้นบน (แถวละ 2 พิกเซล เลื่อนไปทางขวาทีละ 1/4)
   ทุกๆ ~7 วินาที ดาบจะสั่นแล้วเลื่อนออกจากฝักเอง 3 พิกเซล เห็นใบดาบวาบแสงม่วง แล้วกระแทกกลับเข้าฝัก
   รอบๆ มีหัววิญญาณตัวเล็กๆ ลากหางไฟวนรอบ (ด้านหลังวาดก่อน ด้านหน้าวาดทีหลัง) */
function katDraw(t){   // ระยะที่ดาบโผล่ออกจากฝัก (0-3) และการสั่น ณ เวลา t
  const c=t%7.5;
  if(c<.6) return {d:0, sh:Math.round(Math.sin(c*60))*(c>.2?1:0)};      // สั่นก่อน
  if(c<.9) return {d:Math.round((c-.6)/.3*3), sh:0};                     // เลื่อนออก
  if(c<1.9) return {d:3, sh:0};                                          // ค้างไว้ ใบดาบเรืองแสง
  if(c<2.0) return {d:Math.round((2.0-c)/.1*3), sh:0};                   // กระแทกกลับ
  return {d:0, sh:0};
}
function drawKatana(){
  if(!katP || souv[2].t<0) return;
  const s=popScale(souv[2].t), on=Math.min(1,(time-souv[2].t)/1.5), n=1-theme;
  const {d,sh}=katDraw(time), bx=katP.x+sh, by=katP.y, L=Math.max(4,Math.round(24*s)), cut=24-L, slope=.25;
  const cx=bx+3, cy=by-12;   // จุดกลางสำหรับวงโคจรวิญญาณ
  const ghosts=front=>{
    for(let g=0;g<3;g++){
      for(let k=5;k>=0;k--){   // k>0 = หางไฟ (ตำแหน่งย้อนเวลา), k=0 = หัว
        const tt=time-k*.06, a=tt*1.3+g*Math.PI*2/3, z=Math.sin(a); if((z>0)!==front && k===0) continue; if((z>0)!==front) continue;
        const x=Math.round(cx+Math.cos(a)*9), y=Math.round(cy+Math.sin(a)*3+Math.sin(tt*2.3+g)*5-g*3);
        if(k>0){ ctx.globalAlpha=on*(.85-k*.12)*(front?1:.6); ctx.fillStyle=k<3?'#9a7cf2':'#6a4adf'; ctx.fillRect(x,y,1,1); continue; }
        ctx.globalAlpha=on*(.85+.15*Math.sin(time*9+g))*(front?1:.6);
        ctx.fillStyle='#5a3a8a'; ctx.fillRect(x-2,y-2,5,4); ctx.fillRect(x-1,y-3,3,1); ctx.fillRect(x-1,y+2,3,1);   // ขอบม่วงเข้ม
        ctx.fillStyle='#eef0ff'; ctx.fillRect(x-1,y-2,3,4); ctx.fillRect(x-2,y-1,5,2);
        ctx.fillStyle='#3a2f50'; ctx.fillRect(x-1,y,1,1); ctx.fillRect(x+1,y,1,1);   // ตาสองจุด
      }
    }
  };
  // เรืองม่วงเป็นจังหวะ แรงขึ้นตอนดาบโผล่
  ctx.globalCompositeOperation='lighter';
  ctx.globalAlpha=on*(.08+.05*Math.sin(time*2)+(d>0?.12:0))*(.5+.5*n); ctx.drawImage(glowSprite(11,'#9a5cff'),cx-11,cy-11);
  ctx.globalCompositeOperation='source-over';
  ghosts(false);
  ctx.globalAlpha=1;
  const row=(r,col,w=2,dx=0)=>{ if(r<cut) return; const rr=r-cut; ctx.fillStyle=col; ctx.fillRect(bx+Math.round(r*slope)+dx,by-rr,w,1); };
  // ฝัก
  row(0,'#b08a3a'); row(1,'#b08a3a');
  for(let r=2;r<14;r++){ row(r,'#1a1424'); row(r,'#3a2f50',1); }
  row(10,'#7a2a86'); row(11,'#a8408f'); row(12,'#7a2a86');   // เชือกพันฝัก
  row(14,'#d8b25a');                                           // ปากฝัก
  // ใบดาบที่โผล่ออกมา
  for(let r=15;r<15+d;r++){ row(r,'#d8d8f0'); row(r,'#ffffff',1,1); }
  // กระบังดาบ ด้าม หัวด้าม (เลื่อนขึ้นตาม d)
  row(15+d,'#2a2a30',4,-1); row(15+d,'#d8b25a',1,-1);
  for(let r=16+d;r<23+d;r++){ row(r,'#1a1424'); row(r,(r-d)%2?'#9a7cf2':'#1a1424',1,(r-d)%2); }
  row(23+d,'#d8b25a');
  // ใบดาบวาบแสง
  if(d>0){ const r=15+d-1, x=bx+Math.round(r*slope), y=by-(r-cut); ctx.globalCompositeOperation='lighter'; ctx.globalAlpha=on*.7; ctx.drawImage(glowSprite(4,'#c3a6ff'),x-3,y-4); ctx.globalCompositeOperation='source-over';
    if(katDraw(time).d===3 && (time%7.5)<1.2){ ctx.globalAlpha=1; ctx.fillStyle='#ffffff'; ctx.fillRect(x+2,y-1,1,1); ctx.fillRect(x+3,y-2,1,1); } }
  ghosts(true);
  ctx.globalAlpha=1;
}

const glowCache={};
function glowSprite(r,color){ const key=r+color; if(glowCache[key]) return glowCache[key]; const c=mk(r*2+1,r*2+1), g=c.getContext('2d'); g.fillStyle=color; g.globalAlpha=.16; for(let k=r;k>=1;k-=2) disc(g,r,r,k); return glowCache[key]=c; }

const $=id=>document.getElementById(id);
const ring=$('ring'), timeEl=$('time'), hint=$('hint'), startBtn=$('start'), autoBox=$('auto');
const LABEL={focus:'focus',short:'short break',long:'long break'};
let mins={focus:25,short:5,long:15};
try{ const s=JSON.parse(localStorage.getItem('nudee-rain-mins')); if(s) mins={...mins,...s}; }catch(e){}
let mode='focus', total=mins.focus*60, remaining=total, running=false, endAt=0, done=0;
const TICKS=60, ticks=[], NS='http://www.w3.org/2000/svg';
const litGroup=document.createElementNS(NS,'g'); litGroup.setAttribute('class','lit');
const dimGroup=document.createElementNS(NS,'g'); ring.append(dimGroup,litGroup);
for(let i=0;i<TICKS;i++){ const r=document.createElementNS(NS,'rect'); r.setAttribute('x',58); r.setAttribute('y',4); r.setAttribute('width',4); r.setAttribute('height',9);
  r.setAttribute('transform',`rotate(${i*360/TICKS} 60 60)`); r.setAttribute('class','tick'); dimGroup.append(r); ticks.push(r); }
const fmt=s=>{ s=Math.ceil(s); return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0'); };
function render(){
  const t=fmt(remaining); timeEl.textContent=t;
  const lit=Math.ceil((remaining/total)*TICKS-1e-9);
  ticks.forEach((r,i)=>{ const on=i<lit; if(on!==r.classList.contains('on')){ r.classList.toggle('on',on); (on?litGroup:dimGroup).append(r);} });
  startBtn.textContent=running?'pause':(remaining<total?'resume':'start');
  $('minus').disabled=$('plus').disabled=running;
  document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('active',b.dataset.mode===mode));
  const filled=(mode==='long'&&done>0&&done%4===0)?4:done%4;
  document.querySelectorAll('#dots i').forEach((d,i)=>d.classList.toggle('on',i<filled));
  $('sessLabel').textContent=CITIES[stage].name;
  if(running){ hint.textContent=(autoBox.checked?'auto · ':'')+(mode==='focus'?`flying through ${CITIES[stage].name}...`:mode==='long'?'happy birthday, Nu•Dee!':`sunny day in ${CITIES[stage].name}!`); hint.classList.remove('blink'); }
  else if(remaining<total){ hint.textContent='paused'; hint.classList.add('blink'); }
  document.title=running?`${t} · ${LABEL[mode]}`:'Nu•Dee pomodoro · birthday edition';
  keepAwake(running);
}
function setMode(m){
  mode=m; running=false; total=mins[m]*60; remaining=total;
  themeTarget = m==='focus' ? 0 : 1;
  setStage(m==='long' ? 4 : m==='short' ? Math.max(0,(done%4)-1) : done%4);
  speedTarget = m==='focus' ? .25 : 0;
  document.body.classList.toggle('break', m!=='focus');
  hint.textContent='press start to begin'; hint.classList.add('blink');
  render();
}
function start(){ ensureAudio(); if(remaining<=0) return; running=true; speedTarget = mode==='focus' ? 1 : 0; endAt=performance.now()+remaining*1000; render(); }
function pause(){ remaining=Math.max(0,(endAt-performance.now())/1000); running=false; speedTarget = mode==='focus' ? .25 : 0; render(); }
function advance(sound){
  const finished=mode;
  if(sound) chime();
  if(mode==='focus'){ done++; setMode(done%4===0?'long':'short'); } else setMode('focus');
  if(mode==='long') Sound.birthday();
  if(autoBox.checked){ if(finished==='long'){ autoBox.checked=false; hint.textContent='cycle complete! press start'; return; } start(); return; }
  if(sound) hint.textContent = mode==='focus' ? 'break is over. press start' : 'well done! press start for a break';
}
setInterval(()=>{ if(!running) return; remaining=Math.max(0,(endAt-performance.now())/1000); if(remaining<=0){ running=false; advance(true); return; } render(); },200);

let wakeLock=null, wakePending=false;
async function keepAwake(on){ try{ if(on&&!wakeLock&&!wakePending&&'wakeLock' in navigator&&document.visibilityState==='visible'){ wakePending=true; wakeLock=await navigator.wakeLock.request('screen'); wakeLock.addEventListener('release',()=>{wakeLock=null;}); } else if(!on&&wakeLock){ const w=wakeLock; wakeLock=null; await w.release(); } }catch(e){} finally{ wakePending=false; } }

const ensureAudio=()=>Sound.unlock(), chime=()=>Sound.chime();

{ const lab=document.querySelector('.auto'), tip=$('autoTip'); let tt=0;

/* ======================================================================
   PART 3 — เสียง (Web Audio ทั้งหมด)
   ฝนตก (หยุดตอนพัก) + หยดน้ำ + เพลงเปียโนไฟฟ้า lo-fi ช้าๆ + นกร้องหลังฝนหยุด + เสียงกดปุ่ม
   ====================================================================== */
const Sound=(()=>{
  let ac=null, master, reverb, bus={}, noiseBuf, pinkBuf, brownBuf;
  const GAIN=3.5; let vol=.6, muted=false;
  try{ const s=JSON.parse(localStorage.getItem('nudee-rain-sound')); if(s){ vol=s.vol??vol; muted=!!s.muted; } }catch(e){}
  const save=()=>{ try{ localStorage.setItem('nudee-rain-sound',JSON.stringify({vol,muted})); }catch(e){} };
  const R2=(a,b)=>a+Math.random()*(b-a);
  const NOTE={C:0,D:2,E:4,F:5,G:7,A:9,B:11};
  const freq=n=>{ const m=n.match(/^([A-G])(#?)(\d)$/); return 440*Math.pow(2,(NOTE[m[1]]+(m[2]?1:0)+12*(+m[3]+1)-69)/12); };
  function noise(sec,kind){ const n=Math.floor(ac.sampleRate*sec), b=ac.createBuffer(1,n,ac.sampleRate), d=b.getChannelData(0); let b0=0,b1=0,b2=0;
    let l=0; for(let i=0;i<n;i++){ const w=Math.random()*2-1; if(kind==='brown'){ l=(l+.02*w)/1.02; d[i]=l*3.5; } else if(kind==='pink'){ b0=.99765*b0+w*.099; b1=.963*b1+w*.2965; b2=.57*b2+w*1.0526; d[i]=(b0+b1+b2+w*.1848)*.11; } else d[i]=w; } return b; }
  function impulse(sec){ const n=Math.floor(ac.sampleRate*sec), b=ac.createBuffer(2,n,ac.sampleRate); for(let c=0;c<2;c++){ const d=b.getChannelData(c); for(let i=0;i<n;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/n,2.8); } return b; }
  const out=(t,pan)=>{ if(!ac.createStereoPanner) return t; const p=ac.createStereoPanner(); p.pan.value=pan; p.connect(t); return p; };
  function init(){
    ac=new (window.AudioContext||window.webkitAudioContext)();
    const lim=ac.createDynamicsCompressor(); lim.threshold.value=-6; lim.ratio.value=8; lim.connect(ac.destination);
    master=ac.createGain(); master.gain.value=muted?0:vol*vol*GAIN; master.connect(lim);
    reverb=ac.createConvolver(); reverb.buffer=impulse(2.6); const rv=ac.createGain(); rv.gain.value=.35; reverb.connect(rv).connect(master);
    const mkb=(g,wet)=>{ const n=ac.createGain(); n.gain.value=g; n.connect(master); if(wet){ const s=ac.createGain(); s.gain.value=wet; n.connect(s).connect(reverb);} return n; };
    bus.music=mkb(.7,.5); bus.fx=mkb(.8,.35); bus.amb=mkb(.5,.05); bus.ui=mkb(.6,.15);
    bus.musicIn=ac.createBiquadFilter(); bus.musicIn.type='lowpass'; bus.musicIn.frequency.value=2700; bus.musicIn.connect(bus.music);
    noiseBuf=noise(2); pinkBuf=noise(4,'pink'); brownBuf=noise(4,'brown');
    rainSound(); cityAmbience(); birds(); startMusic();
  }
  /* ฝน (ทำใหม่ให้นุ่มหู):
     - เสียง "ซ่า" 2 สาย ซ้าย/ขวา ใช้ pink noise ตัดเสียงแหลมออก (low-pass 1.5 kHz) → นุ่มเหมือนฝนนอกหน้าต่าง
     - แต่ละสายดังเบาสลับกันช้าๆ ให้รู้สึกโล่งและมีชีวิต
     - เสียงทุ้มต่ำเบาๆ เป็นเนื้อฝน + หยดน้ำ "ต๊อก" นุ่มๆ บนกระจกนานๆ ครั้ง
     ดังตามปริมาณฝนของเมือง (ฝนตก > ฝนปรอย > ไม่มี) และค่อยๆ หายตอนแดดออก */
  function layer(buf,pan,hp,lp){ const s=ac.createBufferSource(); s.buffer=buf; s.loop=true; s.start(0,Math.random()*3);
    const h=ac.createBiquadFilter(); h.type='highpass'; h.frequency.value=hp; const l=ac.createBiquadFilter(); l.type='lowpass'; l.frequency.value=lp; l.Q.value=.3;
    const g=ac.createGain(); g.gain.value=0; s.connect(h).connect(l).connect(g).connect(out(bus.amb,pan)); return g; }
  function rainSound(){
    const L=layer(pinkBuf,-.6,250,1500), Rr=layer(pinkBuf,.6,250,1400), body=layer(brownBuf,0,40,320);
    (function upd(){ const lv=weatherLevel(), t=ac.currentTime;
      L.gain.setTargetAtTime(lv*(.15+.04*Math.sin(t*.13)),t,1.5);
      Rr.gain.setTargetAtTime(lv*(.15+.04*Math.sin(t*.11+2)),t,1.5);
      body.gain.setTargetAtTime(lv*.12,t,1.5);
      if(Math.random()<lv*.5){ const tt=t+Math.random()*.4, b=ac.createBufferSource(); b.buffer=noiseBuf; const bp=ac.createBiquadFilter(); bp.type='bandpass'; bp.frequency.value=R2(800,1500); bp.Q.value=4;
        const gg=ac.createGain(); gg.gain.setValueAtTime(0,tt); gg.gain.linearRampToValueAtTime(.03*lv,tt+.004); gg.gain.exponentialRampToValueAtTime(.0001,tt+.09);
        b.connect(bp).connect(gg).connect(out(bus.amb,R2(-.7,-.1))); b.start(tt,Math.random(),.1); }
      setTimeout(upd,400); })();
  }
  /* บรรยากาศแต่ละเมือง: ลมหนาว (หมู่บ้านหิมะ) / เสียงเมืองฮัมเบาๆ (นีออน) / กระดิ่งลม (ซากุระ) */
  function cityAmbience(){
    const wind=layer(brownBuf,.2,60,420), hum=layer(brownBuf,-.2,30,140);
    (function upd(){ const t=ac.currentTime, x=Math.random();
      wind.gain.setTargetAtTime(stage===3 ? (.05+x*.07)*(1-theme*.5) : 0, t, 2);
      hum.gain.setTargetAtTime(stage===1 ? .06*(1-theme*.6) : 0, t, 2);
      setTimeout(upd,R2(3000,7000)); })();
    (function chime(){ if(stage===2 && Math.random()<.8){ [2093,2637,3136].slice(0,2+Math.floor(Math.random()*2)).forEach((f,i)=>{ const tt=ac.currentTime+.05+i*R2(.15,.3), o=ac.createOscillator(), g=ac.createGain();
        o.frequency.value=f*R2(.995,1.005); g.gain.setValueAtTime(0,tt); g.gain.linearRampToValueAtTime(.025,tt+.005); g.gain.exponentialRampToValueAtTime(.0001,tt+1.6); o.connect(g).connect(out(bus.fx,R2(.2,.7))); o.start(tt); o.stop(tt+1.7); }); }
      setTimeout(chime,R2(6000,13000)); })();
  }
  /* เสียงประกายตอนของที่ระลึกผุดขึ้นมา */
  function sparkle(){ if(!ac) return; [1568,2093,2637,3136].forEach((f,i)=>{ const t=ac.currentTime+.02+i*.07, o=ac.createOscillator(), g=ac.createGain(); o.frequency.value=f;
    g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(.03,t+.004); g.gain.exponentialRampToValueAtTime(.0001,t+.6); o.connect(g).connect(out(bus.fx,R2(-.3,.3))); o.start(t); o.stop(t+.65); }); }
  /* ถึงงานวันเกิด: กล่องดนตรีเล่น Happy Birthday เบาๆ หนึ่งรอบ (ทำนองเป็นสาธารณสมบัติ) */
  function birthday(){
    if(!ac) return;
    const tune=[['G5',.75],['G5',.25],['A5',1],['G5',1],['C6',1],['B5',2],['G5',.75],['G5',.25],['A5',1],['G5',1],['D6',1],['C6',2],
                ['G5',.75],['G5',.25],['G6',1],['E6',1],['C6',1],['B5',1],['A5',2],['F6',.75],['F6',.25],['E6',1],['C6',1],['D6',1],['C6',3]];
    const beat=.45; let t=ac.currentTime+1;
    bus.music.gain.setTargetAtTime(.25,ac.currentTime,.5); setTimeout(()=>bus.music.gain.setTargetAtTime(.7,ac.currentTime,1.5),(tune.reduce((a,n)=>a+n[1],0)*beat+2)*1000);
    for(const [n,d] of tune){ const f=freq(n);
      [[1,.06],[3,.016],[4.2,.008]].forEach(([m,v])=>{ const o=ac.createOscillator(), g=ac.createGain(); o.frequency.value=f*m;
        g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(v,t+.004); g.gain.exponentialRampToValueAtTime(.0001,t+(m===1?1.4:.5)); o.connect(g).connect(out(bus.fx,R2(-.2,.2))); o.start(t); o.stop(t+1.5); });
      t+=d*beat; }
  }
  /* นกร้องหลังฝนหยุด */
  function birds(){
    (function b(){ if(theme>.6 && Math.random()<.7){ const t0=ac.currentTime+.05, n=2+Math.floor(Math.random()*3), base=R2(2400,3800), o2=out(bus.fx,R2(-.8,-.2));
        for(let i=0;i<n;i++){ const t=t0+i*R2(.1,.16), o=ac.createOscillator(), g=ac.createGain(), f0=base*R2(.9,1.1);
          o.frequency.setValueAtTime(f0,t); o.frequency.exponentialRampToValueAtTime(f0*1.5,t+.05); g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(.04,t+.01); g.gain.exponentialRampToValueAtTime(.0001,t+.09);
          o.connect(g).connect(o2); o.start(t); o.stop(t+.1); } }
      setTimeout(b,R2(4000,11000)); })();
  }
  function pageTurn(){ if(!ac) return; const t=ac.currentTime, s=ac.createBufferSource(); s.buffer=noiseBuf;
    const bp=ac.createBiquadFilter(); bp.type='bandpass'; bp.frequency.setValueAtTime(1800,t); bp.frequency.linearRampToValueAtTime(3200,t+.25); bp.Q.value=.8;
    const g=ac.createGain(); g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(.04,t+.06); g.gain.exponentialRampToValueAtTime(.0001,t+.3); s.connect(bp).connect(g).connect(bus.fx); s.start(t,Math.random(),.35); }
  function yawn(){ if(!ac) return; const t=ac.currentTime+.1, o=ac.createOscillator(), g=ac.createGain(); o.type='triangle';
    o.frequency.setValueAtTime(900,t); o.frequency.linearRampToValueAtTime(1300,t+.25); o.frequency.linearRampToValueAtTime(700,t+.7);
    g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(.025,t+.1); g.gain.exponentialRampToValueAtTime(.0001,t+.8); o.connect(g).connect(bus.fx); o.start(t); o.stop(t+.85); }
  /* เสียงกดปุ่ม: ป๊อปนุ่มๆ แบบฟองน้ำ */
  function blip(f0,f1,t,v,dur){ const o=ac.createOscillator(), g=ac.createGain(); o.type='sine'; o.frequency.setValueAtTime(f0,t); o.frequency.exponentialRampToValueAtTime(f1,t+dur*.8);
    g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(v,t+.004); g.gain.exponentialRampToValueAtTime(.0001,t+dur); o.connect(g).connect(bus.ui); o.start(t); o.stop(t+dur+.02); }
  function click(kind){
    unlock(); if(!ac) return; const t=ac.currentTime+.005;
    if(kind==='start'){ blip(880,1320,t,.07,.12); blip(1320,1760,t+.09,.06,.16); }
    else if(kind==='pause'){ blip(1320,990,t,.06,.12); blip(990,660,t+.08,.05,.15); }
    else if(kind==='plus') blip(700,1200,t,.06,.09);
    else if(kind==='minus') blip(1000,600,t,.06,.09);
    else if(kind==='tab') blip(1100,700,t,.06,.1);
    else if(kind==='on'){ blip(1046,1568,t,.06,.1); }
    else if(kind==='off'){ blip(1568,1046,t,.05,.1); }
    else blip(900,500,t,.06,.1);
  }

  /* ====== เพลง: lo-fi ฝนตก 66 BPM ======
     เปียโนไฟฟ้านุ่มๆ คอร์ด Fmaj7 – Em7 – Dm7 – Cmaj7 (วนแบบสบายๆ) + เบส + กลองแปรงเบามาก
     ทำนองแต่งไว้ 3 ท่อน สลับกับช่วงที่มีแค่คอร์ด */
  function epiano(f,t,vel,dur,pan){
    const car=ac.createOscillator(), mod=ac.createOscillator(), mg=ac.createGain(), g=ac.createGain();
    car.frequency.value=f; mod.frequency.value=f; mg.gain.setValueAtTime(f*1,t); mg.gain.exponentialRampToValueAtTime(f*.06,t+.9);
    mod.connect(mg).connect(car.frequency);
    g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(vel,t+.01); g.gain.exponentialRampToValueAtTime(vel*.35,t+.5); g.gain.exponentialRampToValueAtTime(.0001,t+Math.max(1,dur)+1.3);
    car.connect(g).connect(out(bus.musicIn,pan)); car.start(t); mod.start(t); car.stop(t+dur+1.5); mod.stop(t+dur+1.5);
  }
  function bass(f,t,dur){ const o=ac.createOscillator(), g=ac.createGain(); o.type='triangle'; o.frequency.value=f; g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(.11,t+.03); g.gain.exponentialRampToValueAtTime(.0005,t+dur); o.connect(g).connect(bus.musicIn); o.start(t); o.stop(t+dur+.05); }
  function brush(t,v){ const s=ac.createBufferSource(); s.buffer=noiseBuf; const bp=ac.createBiquadFilter(); bp.type='bandpass'; bp.frequency.value=5000; bp.Q.value=.6;
    const g=ac.createGain(); g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(v,t+.02); g.gain.exponentialRampToValueAtTime(.0001,t+.18); s.connect(bp).connect(g).connect(out(bus.music,.2)); s.start(t,Math.random(),.2); }
  function softKick(t){ const o=ac.createOscillator(), g=ac.createGain(); o.frequency.setValueAtTime(80,t); o.frequency.exponentialRampToValueAtTime(45,t+.15); g.gain.setValueAtTime(.09,t); g.gain.exponentialRampToValueAtTime(.0001,t+.3); o.connect(g).connect(bus.music); o.start(t); o.stop(t+.32); }
  const BPM=66, BEAT=60/BPM, BAR=BEAT*4;
  const PROG=[
    {b:'F2',c:['A3','C4','E4','G4']},{b:'E2',c:['G3','B3','D4','E4']},{b:'D2',c:['F3','A3','C4','E4']},{b:'C2',c:['E3','G3','B3','D4']},
    {b:'F2',c:['A3','C4','E4','G4']},{b:'E2',c:['G3','B3','D4','E4']},{b:'D2',c:['F3','A3','C4','E4']},{b:'G2',c:['F3','B3','D4','G4']},
  ];
  const MEL=[
    [[[0,1.5,'E5'],[1.5,.5,'D5'],[2,2,'C5']],[[0,3,'B4']],[[0,1,'A4'],[1,1,'C5'],[2,2,'D5']],[[0,3,'G4']],
     [[0,1.5,'A4'],[1.5,.5,'C5'],[2,1,'E5'],[3,1,'D5']],[[0,2,'B4'],[2,2,'G4']],[[0,1,'F4'],[1,1,'A4'],[2,2,'E5']],[[0,3,'D5']]],
    [[[0,2,'G5'],[2,1,'E5'],[3,1,'C5']],[[0,2,'D5'],[2,2,'B4']],[[0,1,'C5'],[1,1,'E5'],[2,2,'A4']],[[0,4,'G4']],
     [[0,1,'C5'],[1,1,'E5'],[2,1.5,'G5'],[3.5,.5,'E5']],[[0,2,'D5'],[2,2,'G4']],[[0,1.5,'A4'],[1.5,.5,'C5'],[2,2,'E5']],[[0,4,'D5']]],
    [[[0,4,'C5']],[[0,2,'B4'],[2,2,'G4']],[[0,4,'A4']],[[0,2,'G4'],[2,2,'E4']],[[0,4,'A4']],[[0,2,'G4'],[2,2,'B4']],[[0,4,'A4']],[[0,2,'G4'],[2,2,'D5']]],
  ];
  let bar=0, sec=-1, lastMel=-1, count=0, next=0;
  const hum=()=>R2(-.01,.01);
  function nextSection(){ count++; if(count===1||Math.random()<.4) return -1; let m; do{ m=Math.floor(Math.random()*MEL.length);}while(m===lastMel); return lastMel=m; }
  function scheduleBar(t){
    if(bar===0) sec=nextSection();
    const c=PROG[bar], sw=BEAT*.15;
    bass(freq(c.b),t,BEAT*1.8); bass(freq(c.b),t+2*BEAT,BEAT*1.6);
    c.c.forEach((n,i)=>epiano(freq(n),t+i*.02+hum(),.075,BEAT*1.8,R2(-.3,.3)));
    if(Math.random()<.5) c.c.slice(1).forEach((n,i)=>epiano(freq(n),t+2.5*BEAT+sw+i*.015,.045,BEAT,R2(-.2,.2)));
    softKick(t); softKick(t+2.5*BEAT+sw); brush(t+BEAT,.03); brush(t+3*BEAT,.03);
    for(let i=0;i<8;i++) brush(t+i*BEAT/2+(i%2?sw:0),.008);
    if(sec>=0) MEL[sec][bar].forEach(([b,d,n],i)=>epiano(freq(n),t+b*BEAT+(b%1?sw:0)+hum(),(i===0?.11:.095)*R2(.9,1.05),d*BEAT,R2(.05,.3)));
    bar=(bar+1)%PROG.length;
  }
  function startMusic(){ next=ac.currentTime+1.2; setInterval(()=>{ while(next<ac.currentTime+2.5){ scheduleBar(next); next+=BAR; } },250); }
  function chime(){ if(!ac) return; [1568,1976,2349,3136].forEach((f,i)=>{ const t=ac.currentTime+.05+i*.16, o=ac.createOscillator(), g=ac.createGain(); o.frequency.value=f;
    g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(.05,t+.005); g.gain.exponentialRampToValueAtTime(.0001,t+1.4); o.connect(g).connect(bus.fx); o.start(t); o.stop(t+1.5); }); }

  const box=$('sound'), slider=$('vol'), btn=$('mute');
  function apply(){ box.classList.toggle('muted',muted); btn.setAttribute('aria-label',muted?'Turn sound on':'Mute sound');
    slider.value=Math.round(vol*100); slider.style.backgroundSize=Math.round(vol*100)+'% 100%';
    if(master) master.gain.setTargetAtTime(muted?0:vol*vol*GAIN,ac.currentTime,.08); save(); }
  function unlock(){ try{ if(!ac) init(); if(ac.state==='suspended') ac.resume(); }catch(e){} }
  function toggleMute(){ unlock(); muted=!muted; if(!muted&&vol<.05) vol=.5; apply(); if(!muted) click('on'); }
  btn.onclick=toggleMute;
  slider.oninput=()=>{ unlock(); vol=slider.value/100; muted=vol===0; apply(); };
  addEventListener('pointerdown',unlock,{once:true}); addEventListener('keydown',unlock,{once:true});
  apply();
  return {unlock,chime,toggleMute,pageTurn,yawn,click,sparkle,birthday};
})();

resize();
setMode('focus');
requestAnimationFrame(frame);
/* PART 4 — ติดตั้งเป็นแอป (PWA) */
if('serviceWorker' in navigator && location.protocol.startsWith('http')){ addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(()=>{})); }
let installEvt=null; const installBtn=document.getElementById('install');
addEventListener('beforeinstallprompt', e => { e.preventDefault(); installEvt=e; installBtn.hidden=false; });
installBtn.onclick = async () => { if(!installEvt) return; installEvt.prompt(); await installEvt.userChoice.catch(()=>{}); installEvt=null; installBtn.hidden=true; };
addEventListener('appinstalled', () => { installBtn.hidden=true; });
</script>
</body>
